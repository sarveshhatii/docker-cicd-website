
name: Docker CI/CD to AWS EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  DOCKERHUB_IMAGE: sarveshhatii/cicd-website
  AWS_REGION: ap-south-1
  EC2_INSTANCE_ID: i-050f5b054472305cf

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Prepare Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Authenticate with Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Build the image and push it to Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}

      # Step 5: Authenticate with AWS using GitHub OIDC
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::020671572525:role/GitHubActions-EC2-Deploy
          aws-region: ${{ env.AWS_REGION }}

      # Step 6: Deploy the image to EC2 using AWS Systems Manager
      - name: Deploy image to EC2 using SSM
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy website from GitHub Actions" \
            --parameters '{"commands":["set -e","sudo docker pull sarveshhatii/cicd-website:latest","sudo docker rm -f cicd-website || true","sudo docker run -d --name cicd-website --restart unless-stopped -p 80:80 sarveshhatii/cicd-website:latest","sudo docker ps --filter name=cicd-website"]}' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --output json
              exit 1
            fi

            sleep 10
          done

          echo "Deployment did not finish within the expected time."
          exit 1
